<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEBULA STRIKE — Asteroids</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #03040b;
  color: white;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
  background:
    radial-gradient(circle at center, #10162b 0%, #050711 45%, #020308 100%);
}

#hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  padding: 22px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  text-shadow: 0 0 12px #65eaff;
}

.panel {
  min-width: 150px;
}

.label {
  color: #71e8ff;
  font-size: 11px;
  letter-spacing: 3px;
  opacity: .8;
}

.value {
  font-size: 27px;
  font-weight: 800;
  letter-spacing: 2px;
}

#centerHUD {
  position: fixed;
  top: 22px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
}

#combo {
  color: #ffdf6b;
  font-size: 15px;
  letter-spacing: 3px;
  opacity: 0;
  transition: opacity .15s;
}

#bossWarning {
  position: fixed;
  top: 30%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #ff4d7d;
  font-size: clamp(25px, 5vw, 70px);
  font-weight: 900;
  letter-spacing: 8px;
  text-align: center;
  text-shadow:
    0 0 10px #ff174f,
    0 0 30px #ff174f;
  opacity: 0;
  pointer-events: none;
}

#overlay {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(2, 3, 10, .65);
  backdrop-filter: blur(8px);
  z-index: 5;
}

.card {
  width: min(620px, calc(100vw - 40px));
  padding: 45px;
  border: 1px solid rgba(105, 234, 255, .35);
  background: rgba(8, 12, 28, .82);
  box-shadow:
    0 0 80px rgba(31, 214, 255, .12),
    inset 0 0 50px rgba(31, 214, 255, .03);
  border-radius: 22px;
  text-align: center;
}

h1 {
  margin: 0 0 10px;
  font-size: clamp(40px, 8vw, 78px);
  line-height: .9;
  letter-spacing: -4px;
  color: #fff;
  text-shadow:
    0 0 10px #52e8ff,
    0 0 35px #008cff;
}

.subtitle {
  color: #75dff3;
  letter-spacing: 5px;
  font-size: 12px;
  margin-bottom: 32px;
}

button {
  border: 1px solid #61e8ff;
  color: #bdf8ff;
  background: rgba(50, 190, 255, .08);
  padding: 15px 30px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 3px;
  cursor: pointer;
  box-shadow: 0 0 25px rgba(57, 222, 255, .12);
  transition: .2s;
}

button:hover {
  background: rgba(50, 220, 255, .2);
  transform: translateY(-2px);
  box-shadow: 0 0 35px rgba(57, 222, 255, .3);
}

.controls {
  margin-top: 28px;
  color: #7f8ba8;
  font-size: 12px;
  line-height: 2;
}

.key {
  display: inline-block;
  min-width: 26px;
  padding: 2px 6px;
  border: 1px solid #394563;
  border-radius: 5px;
  color: #dce9ff;
  margin: 0 2px;
}

.hidden {
  display: none !important;
}

#mobileHint {
  display: none;
}

@media (max-width: 700px) {
  #hud {
    padding: 12px;
  }

  .value {
    font-size: 20px;
  }

  .label {
    font-size: 9px;
  }

  .card {
    padding: 30px 20px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="panel">
    <div class="label">SCORE</div>
    <div class="value" id="score">000000</div>
  </div>

  <div id="centerHUD">
    <div class="label">WAVE</div>
    <div class="value" id="wave">01</div>
    <div id="combo">COMBO ×1</div>
  </div>

  <div class="panel" style="text-align:right">
    <div class="label">LIVES</div>
    <div class="value" id="lives">♥ ♥ ♥</div>
  </div>
</div>

<div id="bossWarning">DANGER<br><small>HEAVY ASTEROIDS INBOUND</small></div>

<div id="overlay">
  <div class="card">
    <h1>NEBULA<br>STRIKE</h1>
    <div class="subtitle">ASTEROID INTERCEPTOR // 2097</div>

    <button id="startBtn">LAUNCH MISSION</button>

    <div class="controls">
      <span class="key">W</span> THRUST
      <span class="key">A</span><span class="key">D</span> ROTATE
      <span class="key">SPACE</span> FIRE
      <br>
      <span class="key">SHIFT</span> HYPERSPACE
      <br>
      Destroy asteroids. Build combos. Survive the waves.
    </div>
  </div>
</div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const waveEl = document.getElementById("wave");
const comboEl = document.getElementById("combo");
const overlay = document.getElementById("overlay");
const startBtn = document.getElementById("startBtn");
const bossWarning = document.getElementById("bossWarning");

let W, H, DPR;

function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth;
  H = innerHeight;

  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

addEventListener("resize", resize);
resize();

const TAU = Math.PI * 2;

const keys = {};
const stars = [];
const particles = [];
const bullets = [];
const asteroids = [];
const powerups = [];
const shockwaves = [];

let player;
let score = 0;
let lives = 3;
let wave = 1;
let combo = 1;
let comboTimer = 0;
let gameRunning = false;
let gameOver = false;
let lastTime = 0;
let spawnTimer = 0;
let shake = 0;
let flash = 0;
let audioCtx = null;

for (let i = 0; i < 180; i++) {
  stars.push({
    x: Math.random(),
    y: Math.random(),
    z: Math.random(),
    twinkle: Math.random() * TAU
  });
}

function sound(freq, duration = .06, type = "sine", volume = .04) {
  if (!audioCtx) return;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = type;
  osc.frequency.value = freq;

  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime + duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function rand(min, max) {
  return Math.random() * (max - min) + min;
}

function wrap(obj, margin = 0) {
  if (obj.x < -margin) obj.x = W + margin;
  if (obj.x > W + margin) obj.x = -margin;
  if (obj.y < -margin) obj.y = H + margin;
  if (obj.y > H + margin) obj.y = -margin;
}

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function makeParticles(x, y, color, amount = 15, speed = 2) {
  for (let i = 0; i < amount; i++) {
    const a = Math.random() * TAU;
    const s = Math.random() * speed + .5;

    particles.push({
      x,
      y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life: 1,
      decay: rand(.015, .045),
      size: rand(1, 4),
      color
    });
  }
}

class Player {
  constructor() {
    this.x = W / 2;
    this.y = H / 2;
    this.vx = 0;
    this.vy = 0;
    this.angle = -Math.PI / 2;
    this.radius = 15;
    this.cooldown = 0;
    this.invulnerable = 2;
    this.thrusting = false;
    this.hyperCooldown = 0;
    this.fireLevel = 1;
  }

  update(dt) {
    if (this.invulnerable > 0) this.invulnerable -= dt;
    if (this.cooldown > 0) this.cooldown -= dt;
    if (this.hyperCooldown > 0) this.hyperCooldown -= dt;

    if (keys["KeyA"] || keys["ArrowLeft"]) {
      this.angle -= 4.5 * dt;
    }

    if (keys["KeyD"] || keys["ArrowRight"]) {
      this.angle += 4.5 * dt;
    }

    this.thrusting = keys["KeyW"] || keys["ArrowUp"];

    if (this.thrusting) {
      const acceleration = 330;

      this.vx += Math.cos(this.angle) * acceleration * dt;
      this.vy += Math.sin(this.angle) * acceleration * dt;

      if (Math.random() < .7) {
        const back = this.angle + Math.PI;

        particles.push({
          x: this.x + Math.cos(back) * 10,
          y: this.y + Math.sin(back) * 10,
          vx: Math.cos(back) * rand(50, 130) + this.vx * .1,
          vy: Math.sin(back) * rand(50, 130) + this.vy * .1,
          life: 1,
          decay: .06,
          size: rand(2, 5),
          color: Math.random() > .5 ? "#65eaff" : "#ffffff"
        });
      }
    }

    const drag = Math.pow(.985, dt * 60);

    this.vx *= drag;
    this.vy *= drag;

    const maxSpeed = 650;
    const speed = Math.hypot(this.vx, this.vy);

    if (speed > maxSpeed) {
      this.vx = this.vx / speed * maxSpeed;
      this.vy = this.vy / speed * maxSpeed;
    }

    this.x += this.vx * dt;
    this.y += this.vy * dt;

    wrap(this);

    if (keys["Space"] && this.cooldown <= 0) {
      this.shoot();
    }

    if (keys["ShiftLeft"] || keys["ShiftRight"]) {
      this.hyperjump();
    }
  }

  shoot() {
    this.cooldown = .15;

    const levels = this.fireLevel;

    for (let i = 0; i < levels; i++) {
      const spread = (i - (levels - 1) / 2) * .12;
      const a = this.angle + spread;

      bullets.push({
        x: this.x + Math.cos(a) * 18,
        y: this.y + Math.sin(a) * 18,
        vx: Math.cos(a) * 850,
        vy: Math.sin(a) * 850,
        life: .9,
        radius: 3
      });
    }

    makeParticles(
      this.x + Math.cos(this.angle) * 18,
      this.y + Math.sin(this.angle) * 18,
      "#ffffff",
      3,
      1.5
    );

    sound(620, .035, "square", .025);
  }

  hyperjump() {
    if (this.hyperCooldown > 0) return;

    this.hyperCooldown = 4;

    makeParticles(this.x, this.y, "#b36cff", 35, 4);

    this.x = rand(80, W - 80);
    this.y = rand(80, H - 80);

    makeParticles(this.x, this.y, "#b36cff", 35, 4);

    shake = 10;
    sound(110, .15, "sawtooth", .05);
  }

  draw() {
    if (
      this.invulnerable > 0 &&
      Math.floor(this.invulnerable * 12) % 2 === 0
    ) return;

    ctx.save();

    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);

    ctx.shadowBlur = 20;
    ctx.shadowColor = "#52e8ff";

    ctx.strokeStyle = "#b9f9ff";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(19, 0);
    ctx.lineTo(-13, -11);
    ctx.lineTo(-8, 0);
    ctx.lineTo(-13, 11);
    ctx.closePath();
    ctx.stroke();

    ctx.fillStyle = "rgba(70,220,255,.12)";
    ctx.fill();

    if (this.thrusting) {
      ctx.shadowColor = "#ff9f43";
      ctx.strokeStyle = "#ffb347";

      ctx.beginPath();
      ctx.moveTo(-10, -5);
      ctx.lineTo(-24 - Math.random() * 8, 0);
      ctx.lineTo(-10, 5);
      ctx.stroke();
    }

    ctx.restore();
  }
}

class Asteroid {
  constructor(x, y, size = 3) {
    this.x = x;
    this.y = y;
    this.size = size;

    const angle = Math.random() * TAU;
    const speedBase = 25 + wave * 3;

    this.vx = Math.cos(angle) * rand(speedBase, speedBase + 65);
    this.vy = Math.sin(angle) * rand(speedBase, speedBase + 65);

    this.radius =
      size === 3 ? 48 :
      size === 2 ? 28 :
      16;

    this.rotation = Math.random() * TAU;
    this.spin = rand(-1.2, 1.2);

    this.vertices = [];

    const count = Math.floor(rand(8, 13));

    for (let i = 0; i < count; i++) {
      this.vertices.push(
        this.radius * rand(.72, 1.18)
      );
    }
  }

  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.rotation += this.spin * dt;

    wrap(this, this.radius);
  }

  draw() {
    ctx.save();

    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);

    ctx.strokeStyle =
      this.size === 3 ? "#a8b4d8" :
      this.size === 2 ? "#7886aa" :
      "#566583";

    ctx.lineWidth = this.size === 3 ? 2.5 : 2;

    ctx.shadowBlur = 8;
    ctx.shadowColor = "#415b94";

    ctx.beginPath();

    for (let i = 0; i < this.vertices.length; i++) {
      const a = i / this.vertices.length * TAU;
      const r = this.vertices[i];

      const x = Math.cos(a) * r;
      const y = Math.sin(a) * r;

      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }

    ctx.closePath();
    ctx.stroke();

    ctx.fillStyle = "rgba(90,110,160,.08)";
    ctx.fill();

    ctx.restore();
  }
}

function spawnAsteroid(size = 3) {
  let x, y;

  do {
    x = rand(0, W);
    y = rand(0, H);
  } while (
    player &&
    Math.hypot(x - player.x, y - player.y) < 250
  );

  asteroids.push(new Asteroid(x, y, size));
}

function startWave() {
  const amount = Math.min(4 + wave * 2, 20);

  for (let i = 0; i < amount; i++) {
    spawnAsteroid(3);
  }

  waveEl.textContent = String(wave).padStart(2, "0");

  if (wave % 5 === 0) {
    bossWarning.style.opacity = 1;

    setTimeout(() => {
      bossWarning.style.opacity = 0;
    }, 1800);

    sound(80, .5, "sawtooth", .08);
  }
}

function destroyAsteroid(index) {
  const a = asteroids[index];

  const points =
    a.size === 3 ? 100 :
    a.size === 2 ? 250 :
    500;

  score += points * combo;

  combo = Math.min(combo + 1, 20);
  comboTimer = 2;

  comboEl.textContent = `COMBO ×${combo}`;
  comboEl.style.opacity = 1;

  makeParticles(
    a.x,
    a.y,
    a.size === 3 ? "#9db4ff" : "#65eaff",
    a.size * 12,
    a.size
  );

  shockwaves.push({
    x: a.x,
    y: a.y,
    radius: 5,
    life: 1
  });

  shake = Math.max(shake, a.size * 2);
  sound(
    150 + a.size * 100,
    .08,
    "sawtooth",
    .035
  );

  if (a.size > 1) {
    const nextSize = a.size - 1;

    for (let i = 0; i < 2; i++) {
      const child = new Asteroid(a.x, a.y, nextSize);

      const angle = i * Math.PI + Math.random();
      const speed = 80 + wave * 5;

      child.vx += Math.cos(angle) * speed;
      child.vy += Math.sin(angle) * speed;

      asteroids.push(child);
    }
  }

  if (Math.random() < .07) {
    powerups.push({
      x: a.x,
      y: a.y,
      type: Math.random() > .5 ? "rapid" : "shield",
      life: 10,
      pulse: 0
    });
  }

  asteroids.splice(index, 1);

  scoreEl.textContent = String(score).padStart(6, "0");
}

function loseLife() {
  if (player.invulnerable > 0) return;

  lives--;

  livesEl.textContent =
    "♥ ".repeat(Math.max(0, lives)).trim() || "—";

  shake = 18;
  flash = 1;

  makeParticles(
    player.x,
    player.y,
    "#ff426f",
    60,
    6
  );

  sound(80, .4, "sawtooth", .08);

  if (lives <= 0) {
    endGame();
    return;
  }

  player.x = W / 2;
  player.y = H / 2;
  player.vx = 0;
  player.vy = 0;
  player.invulnerable = 3;
}

function update(dt) {
  player.update(dt);

  for (const b of bullets) {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    wrap(b);
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    if (bullets[i].life <= 0) {
      bullets.splice(i, 1);
    }
  }

  for (const a of asteroids) {
    a.update(dt);
  }

  // Bullet / asteroid collision
  for (let i = asteroids.length - 1; i >= 0; i--) {
    const a = asteroids[i];

    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];

      if (distance(a, b) < a.radius + b.radius) {
        bullets.splice(j, 1);
        destroyAsteroid(i);
        break;
      }
    }
  }

  // Player / asteroid collision
  for (const a of asteroids) {
    if (
      distance(player, a) <
      player.radius + a.radius * .7
    ) {
      loseLife();
      break;
    }
  }

  // Powerups
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];

    p.life -= dt;
    p.pulse += dt * 5;

    if (distance(player, p) < 25) {
      if (p.type === "rapid") {
        player.fireLevel = Math.min(
          player.fireLevel + 1,
          3
        );

        setTimeout(() => {
          player.fireLevel = Math.max(
            1,
            player.fireLevel - 1
          );
        }, 7000);

        sound(900, .15, "sine", .06);
      }

      if (p.type === "shield") {
        player.invulnerable = 5;
        sound(500, .2, "triangle", .06);
      }

      makeParticles(
        p.x,
        p.y,
        p.type === "rapid" ? "#ffdb5c" : "#7dff9a",
        25,
        3
      );

      powerups.splice(i, 1);
    } else if (p.life <= 0) {
      powerups.splice(i, 1);
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    p.x += p.vx * dt * 60;
    p.y += p.vy * dt * 60;
    p.vx *= .97;
    p.vy *= .97;
    p.life -= p.decay * dt * 60;

    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }

  // Shockwaves
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const s = shockwaves[i];

    s.radius += 150 * dt;
    s.life -= dt * 2;

    if (s.life <= 0) {
      shockwaves.splice(i, 1);
    }
  }

  if (comboTimer > 0) {
    comboTimer -= dt;
  } else {
    combo = 1;
    comboEl.style.opacity = 0;
  }

  if (asteroids.length === 0) {
    wave++;
    startWave();
  }

  shake *= Math.pow(.04, dt);
  flash *= Math.pow(.01, dt);
}

function drawStars(time) {
  for (const s of stars) {
    const x = s.x * W;
    const y = s.y * H;

    const twinkle =
      .4 + Math.sin(time * .001 + s.twinkle) * .3;

    ctx.fillStyle =
      `rgba(150,190,255,${twinkle * s.z})`;

    ctx.beginPath();
    ctx.arc(
      x,
      y,
      s.z * 1.5,
      0,
      TAU
    );
    ctx.fill();
  }
}

function draw() {
  ctx.save();

  const sx = rand(-shake, shake);
  const sy = rand(-shake, shake);

  ctx.translate(sx, sy);

  ctx.clearRect(
    -30,
    -30,
    W + 60,
    H + 60
  );

  drawStars(performance.now());

  // Nebula glow
  const gradient = ctx.createRadialGradient(
    W * .5,
    H * .5,
    0,
    W * .5,
    H * .5,
    Math.max(W, H) * .6
  );

  gradient.addColorStop(0, "rgba(35,70,150,.08)");
  gradient.addColorStop(1, "rgba(0,0,0,0)");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);

  // Bullets
  for (const b of bullets) {
    ctx.save();

    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "#63eaff";
    ctx.shadowBlur = 15;

    ctx.beginPath();
    ctx.arc(
      b.x,
      b.y,
      b.radius,
      0,
      TAU
    );
    ctx.fill();

    ctx.restore();
  }

  // Powerups
  for (const p of powerups) {
    const pulse =
      1 + Math.sin(p.pulse) * .12;

    ctx.save();

    ctx.translate(p.x, p.y);
    ctx.scale(pulse, pulse);

    const color =
      p.type === "rapid"
        ? "#ffda54"
        : "#74ff9b";

    ctx.strokeStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 20;
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.arc(0, 0, 13, 0, TAU);
    ctx.stroke();

    ctx.font = "bold 12px system-ui";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = color;

    ctx.fillText(
      p.type === "rapid" ? "⚡" : "✦",
      0,
      0
    );

    ctx.restore();
  }

  for (const a of asteroids) {
    a.draw();
  }

  for (const s of shockwaves) {
    ctx.save();

    ctx.strokeStyle =
      `rgba(100,220,255,${s.life})`;

    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(
      s.x,
      s.y,
      s.radius,
      0,
      TAU
    );
    ctx.stroke();

    ctx.restore();
  }

  for (const p of particles) {
    ctx.save();

    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;

    ctx.beginPath();
    ctx.arc(
      p.x,
      p.y,
      p.size * p.life,
      0,
      TAU
    );
    ctx.fill();

    ctx.restore();
  }

  if (player) {
    player.draw();
  }

  ctx.restore();

  if (flash > 0) {
    ctx.fillStyle =
      `rgba(255,30,80,${flash * .25})`;

    ctx.fillRect(0, 0, W, H);
  }
}

function loop(time) {
  const dt = Math.min(
    (time - lastTime) / 1000 || 0,
    .033
  );

  lastTime = time;

  if (gameRunning) {
    update(dt);
  }

  draw();

  requestAnimationFrame(loop);
}

function startGame() {
  if (!audioCtx) {
    audioCtx =
      new (window.AudioContext ||
      window.webkitAudioContext)();
  }

  score = 0;
  lives = 3;
  wave = 1;
  combo = 1;

  bullets.length = 0;
  asteroids.length = 0;
  particles.length = 0;
  powerups.length = 0;
  shockwaves.length = 0;

  player = new Player();

  scoreEl.textContent = "000000";
  livesEl.textContent = "♥ ♥ ♥";
  waveEl.textContent = "01";

  overlay.classList.add("hidden");

  gameRunning = true;
  gameOver = false;

  startWave();

  sound(440, .1, "sine", .04);
  sound(660, .15, "sine", .04);
}

function endGame() {
  gameRunning = false;
  gameOver = true;

  setTimeout(() => {
    overlay.classList.remove("hidden");

    document.querySelector(".card").innerHTML = `
      <h1 style="font-size:clamp(45px,8vw,75px)">
        MISSION<br>FAILED
      </h1>

      <div class="subtitle">
        FINAL SCORE // ${String(score).padStart(6, "0")}
      </div>

      <button id="startBtn">RELAUNCH</button>

      <div class="controls">
        W / ↑ THRUST &nbsp;&nbsp;
        A D / ← → ROTATE
        <br>
        SPACE FIRE &nbsp;&nbsp;
        SHIFT HYPERSPACE
      </div>
    `;

    document
      .getElementById("startBtn")
      .addEventListener("click", startGame);

  }, 600);
}

addEventListener("keydown", e => {
  keys[e.code] = true;

  if (
    ["Space", "ArrowUp", "ArrowDown",
     "ArrowLeft", "ArrowRight"].includes(e.code)
  ) {
    e.preventDefault();
  }

  if (e.code === "Enter" && !gameRunning) {
    startGame();
  }
});

addEventListener("keyup", e => {
  keys[e.code] = false;
});

startBtn.addEventListener("click", startGame);

requestAnimationFrame(loop);
</script>

</body>
</html>
