*{box-sizing:border-box}body{margin:0;background:#071522;color:#f2fbff;font:500 16px system-ui,sans-serif}
main{min-height:100dvh;padding:24px clamp(15px,4vw,55px);background:linear-gradient(90deg,#061522e8,#06152233),var(--mission) center/cover fixed}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 auto 22px;max-width:1300px}
.brand a{display:inline-block;color:#c2edf4;font-size:14px;margin-top:8px}.brand small{display:block;color:#d0ebf3;font-weight:800;letter-spacing:.06em}.brand strong{font-size:clamp(26px,4vw,44px);font-style:italic;color:var(--cyan);line-height:1}
.wallet,.hud{border:1px solid #4598a8;border-radius:9px;background:#071923ed;padding:9px 15px;font-weight:800}.wallet span{color:var(--gold)}
.screen{max-width:1300px;margin:auto}.mission{display:grid;grid-template-columns:minmax(270px,.85fr) minmax(360px,1.15fr);gap:20px;align-items:start}
.panel{background:#061b29ef;border:1px solid #4eb5c3;border-radius:14px;padding:clamp(16px,2.5vw,29px);box-shadow:0 0 24px #00101bbc}
h1{margin:0 0 8px;font-size:clamp(23px,3vw,36px);font-style:italic}p{line-height:1.45}.muted{color:var(--muted)}
.equation{font-weight:850;font-size:clamp(34px,5vw,58px);text-align:center;margin:20px 0;padding:10px;background:#0e3443;border:1px solid #3ed3e7;border-radius:10px}
label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:9px 0;font-weight:700}
input{width:95px;padding:8px;color:#061320;background:#ecf9ff;border:0;border-radius:5px;font:800 18px system-ui;text-align:center}
button{background:#14384a;border:1px solid #5899aa;border-radius:8px;padding:10px 14px;color:#f1fbff;font:750 15px system-ui;cursor:pointer}
button.primary,button[aria-pressed=true]{background:linear-gradient(#8bffff,#17ccdf);color:#04191f;border-color:#b0ffff;box-shadow:0 0 14px #23ddf65c}
button:disabled{background:#1e3444;color:#a2b4c0;box-shadow:none;cursor:default}button:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.tools{display:flex;gap:8px;flex-wrap:wrap}.launch{width:100%;margin-top:12px;font-size:19px}.steps{color:var(--cyan);font-size:14px}.status{min-height:47px;color:#e2faff;margin:12px 0 0}
.graph{padding:10px 14px 14px;text-align:center}canvas{display:block;width:100%}#grid{aspect-ratio:1;max-height:60vh;width:auto;max-width:100%;margin:auto;cursor:crosshair}
.flight{position:relative;overflow:hidden;background:#122e44;border:1px solid #50a6b7;border-radius:14px;aspect-ratio:16/8;min-height:300px}
#flightCanvas{position:absolute;inset:0;height:100%}.flightbar{position:absolute;inset:12px 12px auto;display:flex;justify-content:space-between;gap:8px}.keys{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:max-content;max-width:96%;text-align:center}
kbd{border:1px solid #93d1de;border-radius:4px;padding:2px 5px;background:#061723}
.hangar{display:grid;grid-template-columns:1.1fr 1fr;overflow:hidden;padding:0}.drone{min-height:320px;background:var(--hangar) center/cover}.shop{padding:24px}.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px;margin:10px 0;border:1px solid #357e91;border-radius:9px;background:#0c2736}.item small{display:block;color:var(--muted);margin-top:4px}.shop .primary{width:100%;margin-top:12px}
[hidden]{display:none!important}
@media(max-width:740px){main{padding:16px}.mission,.hangar{grid-template-columns:1fr}.drone{min-height:210px}#grid{max-height:75vw}.flightbar{font-size:13px}.hud{padding:7px}}
.flight-cue{position:absolute;top:22%;left:50%;transform:translateX(-50%);white-space:nowrap;margin:0;pointer-events:none}.touch-flight{display:none}.flightbar{align-items:center}.flightbar button{padding:7px 10px}@media(pointer:coarse){.touch-flight{display:flex;position:absolute;bottom:12px;left:50%;transform:translateX(-50%);gap:6px}.touch-flight button{touch-action:none;min-width:44px}.keys{display:none}}

<main id="app">
<header><div class="brand"><small>ClassArcade</small><strong>Graph Rescue</strong><br><a href="../../">← ClassArcade</a></div><div class="wallet">Coins <span id="balance">0</span></div></header>
<section id="mission" class="screen mission">
<div class="panel">
<h1 id="missionTitle" tabindex="-1">Mission 1</h1>
<p class="muted">Graph the equation to program the rescue route.</p>
<div class="equation" id="equation"></div>
<label>M (slope)<input id="slope" type="text" autocomplete="off" spellcheck="false"></label>
<label>Y (y-intercept)<input id="intercept" type="text" autocomplete="off" spellcheck="false"></label>
<p class="steps" id="steps"></p>
<div class="tools"><button id="plot" aria-pressed="true">Plot Point</button><button id="line" disabled>Draw Line</button><button id="clear">Clear Graph</button></div>
<p id="feedback" class="status" role="status"></p>
<button id="launch" class="primary launch" disabled>Launch Drone</button>
</div>
<div class="panel graph"><canvas id="grid" width="640" height="640" tabindex="0" aria-label="Coordinate grid. Use arrow keys to move and Enter to plot. In Draw Line mode, use Enter on each plotted point." aria-describedby="coordinates"></canvas><div id="coordinates" class="muted" aria-live="polite">Grid cursor (0, 0)</div></div>
</section>
<section id="flight" class="screen flight" hidden>
<canvas id="flightCanvas" aria-label="First-person drone cockpit view through a mountain canyon"></canvas>
<div class="flightbar"><span class="hud" id="timer">10.0 s</span><span class="hud" id="pickup">Coins 0</span><button id="sound" aria-pressed="false">Sound off</button><button id="skip">Skip Flight</button></div>
<p id="flightCue" class="flight-cue hud" role="status"></p><div class="touch-flight" aria-label="Drone steering"><button data-flight-key="arrowleft" aria-label="Steer left">←</button><button data-flight-key="arrowup" aria-label="Climb">↑</button><button data-flight-key="arrowdown" aria-label="Dive">↓</button><button data-flight-key="arrowright" aria-label="Steer right">→</button></div><div class="keys hud"><kbd>W</kbd> climb · <kbd>S</kbd> dive · <kbd>A</kbd> left · <kbd>D</kbd> right <span id="boostHint" hidden> · <kbd>Space</kbd> turbo</span></div>
</section>
<section id="hangar" class="screen panel hangar" hidden>
<div class="drone" role="img" aria-label="Yellow rescue drone in a mountain hangar"></div>
<div class="shop"><h1 id="hangarTitle" tabindex="-1">Upgrade Hangar</h1><p id="result" role="status"></p><div id="items"></div><button id="next" class="primary">Next Mission</button></div>
</section>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const missions = [[1,1,2],[2,1,-1],[-1,1,3],[1,2,1],[0,1,-2],[-2,3,2],[3,2,-3],[-2,1,0],[3,1,1],[-1,2,-2]];
const upgrades = [
  {id:'motor', name:'Bigger Motor', price:4, description:'Accelerate faster. Press Space for a one-second turbo burst (2-second cooldown).'},
  {id:'wings', name:'Longer Wings', price:3, description:'Level out faster after releasing the controls.'},
  {id:'magnet', name:'Coin Magnet', price:5, description:'Collect coins from farther away.'}
];
let saved;
try { saved = JSON.parse(localStorage.getItem('classarcade.graphRescue.v1')); } catch {}
const progress = saved && Number.isSafeInteger(saved.stage) && saved.stage >= 0 && Number.isSafeInteger(saved.coins) && saved.coins >= 0 && Array.isArray(saved.owned)
  ? saved : {stage:0, coins:0, owned:[]};
const owned = id => progress.owned.includes(id);
function save() {
  $('balance').textContent = progress.coins;
  try { localStorage.setItem('classarcade.graphRescue.v1', JSON.stringify(progress)); } catch {}
}
function show(screen) {
  for (const id of ['mission','flight','hangar']) $(id).hidden = id !== screen;
}
let equation, points, selected, drawn, mode, cursor, hover;
const grid = $('grid'), pen = grid.getContext('2d');
const limit = 6, spacing = 45, center = 320;
const px = x => center + x * spacing;
const py = y => center - y * spacing;
const same = (a,b) => a.x === b.x && a.y === b.y;
function renderGrid() {
  pen.fillStyle = '#061b28';
  pen.fillRect(0,0,640,640);
  pen.font = '17px system-ui';
  pen.textAlign = 'center';
  for (let i = -limit; i <= limit; i++) {
    pen.strokeStyle = i ? '#295060' : '#e2f8ff';
    pen.lineWidth = i ? 1 : 2.5;
    pen.beginPath();
    pen.moveTo(px(i),35); pen.lineTo(px(i),605);
    pen.moveTo(35,py(i)); pen.lineTo(605,py(i));
    pen.stroke();
    if (i) {
      pen.fillStyle = '#c6e6ef';
      pen.fillText(i,px(i),py(0)+20);
      pen.fillText(i,px(0)-15,py(i)+5);
    }
  }
  pen.fillStyle = '#e2f8ff';
  pen.fillText('y',px(0)+14,29);
  pen.fillText('x',617,py(0)-9);
  if (drawn) {
    const [a,b] = points;
    const slope = (b.y-a.y)/(b.x-a.x);
    const yAt = x => a.y + (x-a.x)*slope;
    pen.save();
    pen.beginPath(); pen.rect(35,35,570,570); pen.clip();
    pen.strokeStyle = '#42f7ff'; pen.lineWidth = 4;
    pen.beginPath();
    if (a.x === b.x) { pen.moveTo(px(a.x),35); pen.lineTo(px(a.x),605); }
    else { pen.moveTo(35,py(yAt(-285/spacing))); pen.lineTo(605,py(yAt(285/spacing))); }
    pen.stroke();
    pen.restore();
  }
  for (const point of points) {
    pen.fillStyle = selected && same(point,selected) ? '#ffcf63' : '#72f5ff';
    pen.beginPath(); pen.arc(px(point.x),py(point.y),7,0,Math.PI*2); pen.fill();
    pen.textAlign = point.x >= 4 ? 'right' : 'left';
    pen.fillText('('+point.x+', '+point.y+')',px(point.x)+(point.x >= 4 ? -10 : 10),py(point.y)-10);
  }
  const aim = hover || (document.activeElement === grid ? cursor : null);
  if (aim) {
    pen.strokeStyle = '#ffdc82'; pen.lineWidth = 2;
    pen.beginPath(); pen.arc(px(aim.x),py(aim.y),12,0,Math.PI*2); pen.stroke();
  }
}
function readNumber(raw) {
  const parts = raw.trim().replace(/−/g,'-').split('/').map(part => part.trim());
  if (parts.length > 2 || parts.some(part => !/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(part))) return NaN;
  return Number(parts[0]) / (parts.length === 2 ? Number(parts[1]) : 1);
}
function update() {
  const [n,d,b] = equation;
  const onLine = point => d*(point.y-b) === n*point.x;

const flightDuration = 10;
const keys = new Set();
const directions = {w:'up',s:'down',a:'left',d:'right',arrowup:'up',arrowdown:'down',arrowleft:'left',arrowright:'right'};
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
let run, audio, soundOn = false;

function tone(frequency, end, duration, volume = .07, waveform = 'sine') {
  if (!soundOn || audio?.state !== 'running') return;
  const time = audio.currentTime, wave = audio.createOscillator(), gain = audio.createGain();
  wave.type = waveform;
  wave.frequency.setValueAtTime(frequency,time);
  wave.frequency.exponentialRampToValueAtTime(end,time+duration);
  gain.gain.setValueAtTime(volume,time);
  gain.gain.exponentialRampToValueAtTime(.001,time+duration);
  wave.connect(gain).connect(audio.destination);
  wave.start(time);
  wave.stop(time+duration);
}
$('sound').onclick = () => {
  if (!window.AudioContext) return;
  soundOn = !soundOn;
  if (!soundOn) window.speechSynthesis?.cancel();
  if (soundOn) {
    audio ??= new AudioContext();
    audio.resume().catch(() => {});
  }
  $('sound').textContent = soundOn ? 'Sound on' : 'Sound off';
  $('sound').setAttribute('aria-pressed',String(soundOn));
};

function pressFlight(key) {
  if (!run || (!directions[key] && key !== ' ')) return false;
  if (key === ' ' && run.start !== null && owned('motor') && !keys.has(key)) {
    const elapsed = (performance.now()-run.start)/1000;
    if (elapsed >= run.motorReady) {
      run.motorUntil = elapsed+1;
      run.motorReady = elapsed+3;
      tone(72,260,.65,.085,'triangle');
    }
  }
  keys.add(key);
  if (run.start === null && directions[key]) {
    run.start = run.last = performance.now();
    run.cueUntil = 1.2;
    $('flightCue').textContent = 'Gold trail · Blue bonus trail';
    tone(95,180,.28,.045);
  }
  return true;
}
window.addEventListener('keydown',event => {
  if (event.key === ' ' && event.target instanceof HTMLButtonElement) return;
  if (pressFlight(event.key.toLowerCase())) event.preventDefault();
});
window.addEventListener('keyup',event => keys.delete(event.key.toLowerCase()));
window.addEventListener('blur',() => keys.clear());
for (const button of document.querySelectorAll('[data-flight-key]')) {
  const key = button.dataset.flightKey;
  button.onpointerdown = event => {
    if (pressFlight(key)) button.setPointerCapture(event.pointerId);
  };
  button.onpointerup = button.onpointercancel = button.onlostpointercapture = () => keys.delete(key);
  button.onclick = event => {
    if (event.detail !== 0 || !pressFlight(key)) return;
    run.tap = {key,until:performance.now()+150};
    keys.delete(key);
  };
}

    boost:0,motorUntil:0,motorReady:0,bank:0,rescueAt:-10,flash:0,rescued:false,reported:false,cueUntil:0,tap:null,
    pickups:[
      [0,0,1.1,'gold'],[0,0,2.05,'gold'],[0,0,3.6,'gold'],[0,0,4.55,'gold'],
      [.66*side,.34,2.65,'blue'],[.7*side,.44,3.55,'blue'],
      [.53*side,.54,4.4,'boost'],[.38*side,.42,5.25,'blue'],
      [0,0,5.85,'gold'],[0,0,6.8,'beacon'],[0,0,7.65,'gold'],[.28*side,0,8.55,'gold']
    ].map(([x,y,z,kind]) => ({x,y,z,kind,done:false})).sort((a,b)=>a.z-b.z)
  };
  $('boostHint').hidden = !owned('motor');
  $('pickup').textContent = 'Coins 0';
  $('timer').textContent = '10.0 s';
  $('flightCue').textContent = 'Steer to start · WASD or arrows';
  $('launch').blur();
  requestAnimationFrame(tick);
}
function signal(message, elapsed) {
  $('flightCue').textContent = message;
  run.cueUntil = elapsed+1;
}
function tick(now) {
  if (!run) return;
  if (run.start === null) {
    drawFlight(0);
    requestAnimationFrame(tick);
    return;
  }
  const elapsed = (now-run.start)/1000;
  if (elapsed >= flightDuration) { finishFlight(); return; }
  const dt = clamp((now-run.last)/1000,0,.05);
  run.last = now;
  const active = new Set([...keys].map(key=>directions[key]));
  if (run.tap?.until > now) active.add(directions[run.tap.key]);
  let dx = Number(active.has('right'))-Number(active.has('left'));
  let dy = Number(active.has('up'))-Number(active.has('down'));
  const length = Math.max(1,Math.hypot(dx,dy));
  dx /= length;
  dy /= length;
  const response = 1-Math.exp(-dt*(owned('wings') ? 29 : 18));
  run.vx += (dx*1.72-run.vx)*response;
  run.vy += (dy*1.72-run.vy)*response;
  run.x = clamp(run.x+run.vx*dt,-1,1);
  run.y = clamp(run.y+run.vy*dt,-1,1);
  const bankResponse = dx === 0 && owned('wings') ? 15 : 6;
  run.bank += (-dx*.24-run.bank)*(1-Math.exp(-dt*bankResponse));
  const boosting = run.motorUntil > elapsed || run.boost > elapsed;
  run.boosting = boosting;
  const speed = boosting ? 1.55 : owned('motor') ? 1.10 : .93;
  run.speed += (speed-run.speed)*(1-Math.exp(-dt*(owned('motor') ? 8 : 4)));
  const previousDistance = run.distance;
  run.distance += run.speed*dt;
  for (const item of run.pickups) {
    if (item.z <= previousDistance || item.z > run.distance) continue;
    const radius = item.kind === 'beacon' ? .43 : owned('magnet') ? .57 : .29;
    if (Math.hypot(item.x-run.x,item.y-run.y) > radius) {
      if (item.kind === 'beacon') signal('Beacon missed · Try the center on your next flight',elapsed);
      continue;
    }
    item.done = true;
    run.flash = elapsed+.2;
    if (item.kind === 'beacon') {
      run.rescued = true;
      run.coins += 3;
      run.rescueAt = elapsed;
      signal('Beacon locked · Rescue complete · +3 coins',elapsed);
      tone(520,950,.24);
      if (soundOn && window.speechSynthesis && window.SpeechSynthesisUtterance) {
        const call = new SpeechSynthesisUtterance('Beacon locked. Rescue complete.');
        call.rate = 1.08;
        call.volume = .7;
        window.speechSynthesis.speak(call);
      }
    } else if (item.kind === 'boost') {
      run.boost = elapsed+.65;
      signal('Turbo burst',elapsed);
      tone(130,300,.24);
    } else {
      run.streak++;
      const bonus = run.streak % 3 === 0 ? 1 : 0;
      const value = (item.kind === 'blue' ? 2 : 1)+bonus;
      run.coins += value;
      signal(bonus ? '3 pickups · +1 streak bonus' : '+'+value+' '+(value===1?'coin':'coins'),elapsed);
      tone(550+run.streak*65,710+run.streak*65,.12);
    }
  }
  if (elapsed-run.rescueAt < 2) {
    $('flightCue').textContent = 'Beacon locked · Rescue complete · +3 coins';
  } else if (elapsed > run.cueUntil) {
    const cue = run.rescued ? 'Rescue complete' : run.distance > 5.25 && run.distance < 6.8 ? 'Fly through the rescue beacon' : '';
    if ($('flightCue').textContent !== cue) $('flightCue').textContent = cue;
  }
  if (elapsed >= 9 && !run.reported) {
    run.reported = true;
    tone(440,390,.14,.035);
  }
  $('timer').textContent = (flightDuration-elapsed).toFixed(1)+' s';
  $('pickup').textContent = 'Coins '+run.coins+(boosting ? ' · TURBO' : '');
  drawFlight(elapsed);
  requestAnimationFrame(tick);
}
function drawCanyonForeground(ctx,width,height,horizon,pitch) {
  const floor = horizon+pitch;
  const vanishingX = width*(.5-run.x*.045);
  // Project repeating rock faces and ground streaks along the flight path.
  for (let index=11; index>=0; index--) {
    const depth = ((index*.48-run.distance%5.76)+5.76)%5.76;
    const scale = 1/(1+depth*1.4);
    const opacity = Math.min(1,depth*5)*scale;
    for (const side of [-1,1]) {
      const variation = .94+.12*Math.sin(index*2.1+side);
      const edge = vanishingX+side*width*(.14+.50*scale)*variation;
      const base = floor+height*.69*scale;
      ctx.fillStyle = 'rgba(23,32,46,'+opacity*.78+')';
      ctx.beginPath();
      ctx.moveTo(edge,base);
      ctx.lineTo(edge-side*width*.06*scale,base-height*.26*scale);
      ctx.lineTo(edge+side*width*.09*scale,base-height*.58*scale);
      ctx.lineTo(edge+side*width*.25*scale,base-height*.60*scale);
      ctx.lineTo(edge+side*width*.30*scale,base+height*.05*scale);
      ctx.closePath();
      ctx.fill();
      const streakX = vanishingX+side*width*.36*scale*variation;
      ctx.strokeStyle = 'rgba(189,221,231,'+opacity*(run.boosting ? .82 : .40)+')';
      ctx.lineWidth = 1+scale*2;
      ctx.beginPath();
      ctx.moveTo(streakX,floor+height*.49*scale);
      ctx.lineTo(streakX+side*width*.05*scale,base);
      ctx.stroke();
    }
  }
}
function drawFlight(elapsed) {
  const width = flightCanvas.clientWidth, height = flightCanvas.clientHeight;
  const ratio = Math.min(devicePixelRatio || 1,1.5);
  if (flightCanvas.width !== Math.round(width*ratio) || flightCanvas.height !== Math.round(height*ratio)) {
    flightCanvas.width = Math.round(width*ratio);
    flightCanvas.height = Math.round(height*ratio);
  }
  const ctx = flightPen;
  ctx.setTransform(ratio,0,0,ratio,0,0);
  ctx.fillStyle = '#102c43';
  ctx.fillRect(0,0,width,height);
  const horizon = height*(.40-Math.atan(equation[0]/equation[1])*.07);
  const center = width*.5;
  const aimY = horizon+height*.24;
  const motion = !reducedMotion.matches;
  const bank = motion ? run.bank : 0;
  const pitch = motion ? run.vy*height*.035 : 0;
  ctx.save();
  ctx.translate(center,aimY);
  ctx.rotate(bank);
  ctx.translate(-center,-aimY);
  if (canyon.complete && canyon.naturalWidth) {
    // Overscan only as the view rolls so the windshield never exposes image edges.
    const scale = Math.max(width/canyon.naturalWidth,height/canyon.naturalHeight)*(1.12+Math.abs(bank)*Math.max(width/height,height/width)*1.25+(motion ? run.distance*.015 : 0));
    const w = canyon.naturalWidth*scale, h = canyon.naturalHeight*scale;
    ctx.drawImage(canyon,(width-w)/2-(motion?run.x*width*.035:0),(height-h)/2+pitch+(motion?run.y*height*.04:0),w,h);
  }
  if (motion) drawCanyonForeground(ctx,width,height,horizon,pitch);
  const steeringWidth = width*.25, steeringHeight = height*.22;
  for (let index=run.pickups.length-1; index>=0; index--) {
    const item = run.pickups[index], depth = item.z-run.distance;
    if (item.done || depth < 0 || depth > 5) continue;
    const scale = 1/(1+depth*1.18);
    const x = center+(item.x-run.x)*steeringWidth*scale;
    const y = horizon+(height*.24-(item.y-run.y)*steeringHeight)*scale;
    const beacon = item.kind === 'beacon';
    const color = {gold:'#ffe27a',blue:'#76e8ff',boost:'#e1a0ff',beacon:'#92ffc6'}[item.kind];
    const size = Math.max(4,Math.min(width,height)*(beacon ? .13 : .056)*scale);
    if (beacon) {
      const pulse = motion ? .5+.5*Math.sin(elapsed*Math.PI*3) : .5;
      ctx.strokeStyle = 'rgba(146,255,198,'+(.28+pulse*.42)+')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x,y,size*(1.28+pulse*.32),0,Math.PI*2);
      ctx.stroke();
      ctx.fillStyle = '#d7ffeb';
      ctx.font = 'bold 11px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('RESCUE BEACON',x,y-size*1.8-5);
    }
    ctx.strokeStyle = color;
    ctx.fillStyle = '#122433dd';
    ctx.lineWidth = Math.max(2,size*.17);
    ctx.beginPath();
    ctx.ellipse(x,y,size*(beacon?1:.78),size,0,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold '+Math.ceil(size)+'px system-ui';
    ctx.fillText({gold:'1',blue:'2',boost:'⚡',beacon:'✚'}[item.kind],x,y);
  }
  ctx.restore();

  // The dashboard stays fixed to the pilot while the canyon rolls in the windshield.
  const dashboard = ctx.createLinearGradient(0,height*.82,0,height);
  dashboard.addColorStop(0,'#183946');
  dashboard.addColorStop(.22,'#0b202b');
  dashboard.addColorStop(1,'#040c13');
  ctx.fillStyle = dashboard;
  ctx.strokeStyle = '#427281';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0,height*.78);
  ctx.lineTo(width*.18,height*.87);
  ctx.lineTo(width*.37,height*.92);
  ctx.lineTo(width*.63,height*.92);
  ctx.lineTo(width*.82,height*.87);
  ctx.lineTo(width,height*.78);
  ctx.lineTo(width,height);
  ctx.lineTo(0,height);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.strokeStyle = run.rescued ? '#92ffc6' : '#d5faff';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(center,aimY,8,0,Math.PI*2);
  ctx.stroke();
  if (run.flash > elapsed) {
    ctx.strokeStyle = '#fff2a3';
    ctx.lineWidth = 2;
    ctx.beginPath();ctx.arc(center,aimY,15,0,Math.PI*2);ctx.stroke();
  }
}
function finishFlight(skipped = false) {
  if (!run) return;
  const {coins,rescued} = run;
  run = null;
  keys.clear();
  progress.stage++;
  progress.coins += coins+1;
  save();
  $('result').textContent = 'Graph complete · 1 mission coin + '+coins+' from flight'
    +(rescued ? ' · Rescue beacon reached' : skipped ? ' · Flight skipped' : ' · Beacon missed');
  renderShop();
  show('hangar');
  $('hangarTitle').focus();
}
function renderShop() {
  $('items').replaceChildren();
  for (const upgrade of upgrades) {
    const row = document.createElement('div');
    row.className = 'item';
    const label = document.createElement('div');
    const title = document.createElement('strong');
    const desc = document.createElement('small');
    title.textContent = upgrade.name;
    desc.textContent = upgrade.description;
    label.append(title,desc);
    const button = document.createElement('button');
    button.className = 'primary';
    button.textContent = owned(upgrade.id) ? 'Equipped' : 'Buy · '+upgrade.price;
    button.setAttribute('aria-label',upgrade.name+' '+button.textContent);
    button.disabled = owned(upgrade.id) || progress.coins < upgrade.price;
    button.onclick = () => {
      if (owned(upgrade.id) || progress.coins < upgrade.price) return;
      progress.coins -= upgrade.price;
      progress.owned.push(upgrade.id);
      save(); renderShop(); $('next').focus();
    };
    row.append(label,button);
    $('items').append(row);
  }
}
$('launch').onclick = beginFlight;
$('skip').onclick = () => finishFlight(true);
$('next').onclick = startMission;
save();
startMission();
</script>
