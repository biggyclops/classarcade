  wave.frequency.setValueAtTime(frequency,time);
  wave.frequency.exponentialRampToValueAtTime(end,time+duration);
  gain.gain.setValueAtTime(volume,time);
  gain.gain.exponentialRampToValueAtTime(.001,time+duration);
  wave.connect(gain).connect(audio.destination);
  wave.start(time);
  wave.stop(time+duration);
}
$('sound').onclick = () => {
  if (!window.AudioContext) return;
  soundOn = !soundOn;
  if (soundOn) {
    audio ??= new AudioContext();
    audio.resume().catch(() => {});
  }
  $('sound').textContent = soundOn ? 'Sound on' : 'Sound off';
  $('sound').setAttribute('aria-pressed',String(soundOn));
};

function pressFlight(key) {
  if (!run || (!directions[key] && key !== ' ')) return false;
  keys.add(key);
  if (run.start === null && directions[key]) {
    run.start = run.last = performance.now();
    run.cueUntil = 1.2;
    $('flightCue').textContent = 'Gold trail · Blue bonus trail';
    tone(95,180,.28,.045);
  }
  return true;
}
window.addEventListener('keydown',event => {
  if (event.key === ' ' && event.target instanceof HTMLButtonElement) return;
  if (pressFlight(event.key.toLowerCase())) event.preventDefault();
});
window.addEventListener('keyup',event => keys.delete(event.key.toLowerCase()));
window.addEventListener('blur',() => keys.clear());
for (const button of document.querySelectorAll('[data-flight-key]')) {
  const key = button.dataset.flightKey;
  button.onpointerdown = event => {
    if (pressFlight(key)) button.setPointerCapture(event.pointerId);
  };
  button.onpointerup = button.onpointercancel = button.onlostpointercapture = () => keys.delete(key);
  button.onclick = event => {
    if (event.detail !== 0 || !pressFlight(key)) return;
    run.tap = {key,until:performance.now()+150};
    keys.delete(key);
  };
}

const clamp = (value,min,max) => Math.max(min,Math.min(max,value));
function beginFlight() {
  if ($('launch').disabled || run) return;
  show('flight');
  const side = progress.stage % 2 ? -1 : 1;
  run = {
    start:null,last:null,x:0,y:0,vx:0,vy:0,speed:.85,distance:0,coins:0,streak:0,
    boost:0,flash:0,rescued:false,reported:false,cueUntil:0,tap:null,
    pickups:[
      [0,0,1.1,'gold'],[0,0,2.05,'gold'],[0,0,3.6,'gold'],[0,0,4.55,'gold'],
      [.66*side,.34,2.65,'blue'],[.7*side,.44,3.55,'blue'],
      [.53*side,.54,4.4,'boost'],[.38*side,.42,5.25,'blue'],
      [0,0,5.85,'gold'],[0,0,6.8,'beacon'],[0,0,7.65,'gold'],[.28*side,0,8.55,'gold']
    ].map(([x,y,z,kind]) => ({x,y,z,kind,done:false})).sort((a,b)=>a.z-b.z)
  };
  $('boostHint').hidden = !owned('motor');
  $('pickup').textContent = 'Coins 0';
  $('timer').textContent = '10.0 s';
  $('flightCue').textContent = 'Steer to start · WASD or arrows';
  $('launch').blur();
  requestAnimationFrame(tick);
}
function signal(message, elapsed) {
  $('flightCue').textContent = message;
  run.cueUntil = elapsed+1;
}
function tick(now) {
  if (!run) return;
  if (run.start === null) {
    drawFlight(0);
    requestAnimationFrame(tick);
    return;
  }
  const elapsed = (now-run.start)/1000;
  if (elapsed >= flightDuration) { finishFlight(); return; }
  const dt = clamp((now-run.last)/1000,0,.05);
  run.last = now;
  const active = new Set([...keys].map(key=>directions[key]));
  if (run.tap?.until > now) active.add(directions[run.tap.key]);
  let dx = Number(active.has('right'))-Number(active.has('left'));
  let dy = Number(active.has('up'))-Number(active.has('down'));
  const length = Math.max(1,Math.hypot(dx,dy));
  dx /= length;
  dy /= length;
  const response = 1-Math.exp(-dt*(owned('wings') ? 29 : 18));
  run.vx += (dx*1.72-run.vx)*response;
  run.vy += (dy*1.72-run.vy)*response;
  run.x = clamp(run.x+run.vx*dt,-1,1);
  run.y = clamp(run.y+run.vy*dt,-1,1);
  const boosting = (owned('motor') && keys.has(' ')) || run.boost > elapsed;
  const speed = boosting ? 1.55 : owned('motor') ? 1.10 : .93;
  run.speed += (speed-run.speed)*(1-Math.exp(-dt*(owned('motor') ? 8 : 4)));
  const previousDistance = run.distance;
  run.distance += run.speed*dt;
  for (const item of run.pickups) {
    if (item.z <= previousDistance || item.z > run.distance) continue;
    const radius = item.kind === 'beacon' ? .43 : owned('magnet') ? .57 : .29;
    if (Math.hypot(item.x-run.x,item.y-run.y) > radius) {
      if (item.kind === 'beacon') signal('Beacon missed · Try the center on your next flight',elapsed);
      continue;
    }
    item.done = true;
    run.flash = elapsed+.2;
    if (item.kind === 'beacon') {
      run.rescued = true;
      run.coins += 3;
      signal('Rescue beacon reached · +3 coins',elapsed);
      tone(520,950,.24);
    } else if (item.kind === 'boost') {
      run.boost = elapsed+.65;
      signal('Turbo burst',elapsed);
      tone(130,300,.24);
    } else {
      run.streak++;
      const bonus = run.streak % 3 === 0 ? 1 : 0;
      const value = (item.kind === 'blue' ? 2 : 1)+bonus;
      run.coins += value;
      signal(bonus ? '3 pickups · +1 streak bonus' : '+'+value+' '+(value===1?'coin':'coins'),elapsed);
      tone(550+run.streak*65,710+run.streak*65,.12);
    }
  }
  if (elapsed > run.cueUntil) {
    const cue = run.rescued ? 'Rescue complete' : run.distance > 5.25 && run.distance < 6.8 ? 'Fly through the rescue beacon' : '';
    if ($('flightCue').textContent !== cue) $('flightCue').textContent = cue;
  }
  if (elapsed >= 9 && !run.reported) {
    run.reported = true;
    tone(440,390,.14,.035);
  }
  $('timer').textContent = (flightDuration-elapsed).toFixed(1)+' s';
  $('pickup').textContent = 'Coins '+run.coins+(boosting ? ' · TURBO' : '');
  drawFlight(elapsed);
  requestAnimationFrame(tick);
}
function drawFlight(elapsed) {
  const width = flightCanvas.clientWidth, height = flightCanvas.clientHeight;
  const ratio = Math.min(devicePixelRatio || 1,1.5);
  if (flightCanvas.width !== Math.round(width*ratio) || flightCanvas.height !== Math.round(height*ratio)) {
    flightCanvas.width = Math.round(width*ratio);
    flightCanvas.height = Math.round(height*ratio);
  }
  const ctx = flightPen;
  ctx.setTransform(ratio,0,0,ratio,0,0);
  ctx.fillStyle = '#102c43';
  ctx.fillRect(0,0,width,height);
  const horizon = height*(.40-Math.atan(equation[0]/equation[1])*.07);
  const center = width*.5;
  const aimY = horizon+height*.24;
  const motion = !reducedMotion.matches;
  const bank = motion ? -run.vx*.13 : 0;
  const pitch = motion ? run.vy*height*.035 : 0;
  ctx.save();
  ctx.translate(center,aimY);
  ctx.rotate(bank);
  ctx.translate(-center,-aimY);
  if (canyon.complete && canyon.naturalWidth) {
    // Overscan only as the view rolls so the windshield never exposes image edges.
    const scale = Math.max(width/canyon.naturalWidth,height/canyon.naturalHeight)*(1.12+Math.abs(bank)*Math.max(width/height,height/width)*1.25+(motion ? run.distance*.015 : 0));
    const w = canyon.naturalWidth*scale, h = canyon.naturalHeight*scale;
    ctx.drawImage(canyon,(width-w)/2-(motion?run.x*width*.035:0),(height-h)/2+pitch+(motion?run.y*height*.04:0),w,h);
  }
  const steeringWidth = width*.25, steeringHeight = height*.22;
  for (let index=run.pickups.length-1; index>=0; index--) {
    const item = run.pickups[index], depth = item.z-run.distance;
    if (item.done || depth < 0 || depth > 5) continue;
    const scale = 1/(1+depth*1.18);
    const x = center+(item.x-run.x)*steeringWidth*scale;
    const y = horizon+(height*.24-(item.y-run.y)*steeringHeight)*scale;
    const beacon = item.kind === 'beacon';
    const color = {gold:'#ffe27a',blue:'#76e8ff',boost:'#e1a0ff',beacon:'#92ffc6'}[item.kind];
    const size = Math.max(4,Math.min(width,height)*(beacon ? .13 : .056)*scale);
    ctx.strokeStyle = color;
    ctx.fillStyle = '#122433dd';
    ctx.lineWidth = Math.max(2,size*.17);
    ctx.beginPath();
    ctx.ellipse(x,y,size*(beacon?1:.78),size,0,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold '+Math.ceil(size)+'px system-ui';
    ctx.fillText({gold:'1',blue:'2',boost:'⚡',beacon:'✚'}[item.kind],x,y);
  }
  ctx.restore();

  // The dashboard stays fixed to the pilot while the canyon rolls in the windshield.
  const dashboard = ctx.createLinearGradient(0,height*.82,0,height);
  dashboard.addColorStop(0,'#183946');
  dashboard.addColorStop(.22,'#0b202b');
  dashboard.addColorStop(1,'#040c13');
  ctx.fillStyle = dashboard;
  ctx.strokeStyle = '#427281';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0,height*.78);
  ctx.lineTo(width*.18,height*.87);
  ctx.lineTo(width*.37,height*.92);
  ctx.lineTo(width*.63,height*.92);
  ctx.lineTo(width*.82,height*.87);
  ctx.lineTo(width,height*.78);
  ctx.lineTo(width,height);
  ctx.lineTo(0,height);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.strokeStyle = '#d5faff';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(center,aimY,8,0,Math.PI*2);
  ctx.stroke();
  if (run.flash > elapsed) {
    ctx.strokeStyle = '#fff2a3';
    ctx.lineWidth = 2;
    ctx.beginPath();ctx.arc(center,aimY,15,0,Math.PI*2);ctx.stroke();
  }
}
function finishFlight(skipped = false) {
  if (!run) return;
  const {coins,rescued} = run;
  run = null;
  keys.clear();
  progress.stage++;
  progress.coins += coins+1;
  save();
  $('result').textContent = 'Graph complete · 1 mission coin + '+coins+' from flight'
    +(rescued ? ' · Rescue beacon reached' : skipped ? ' · Flight skipped' : ' · Beacon missed');
  renderShop();
  show('hangar');
  $('hangarTitle').focus();
}
function renderShop() {
  $('items').replaceChildren();
  for (const upgrade of upgrades) {
    const row = document.createElement('div');
    row.className = 'item';
    const label = document.createElement('div');
    const title = document.createElement('strong');
    const desc = document.createElement('small');
    title.textContent = upgrade.name;
    desc.textContent = upgrade.description;
    label.append(title,desc);
    const button = document.createElement('button');
    button.className = 'primary';
    button.textContent = owned(upgrade.id) ? 'Equipped' : 'Buy · '+upgrade.price;
    button.setAttribute('aria-label',upgrade.name+' '+button.textContent);
    button.disabled = owned(upgrade.id) || progress.coins < upgrade.price;
    button.onclick = () => {
      if (owned(upgrade.id) || progress.coins < upgrade.price) return;
      progress.coins -= upgrade.price;
      progress.owned.push(upgrade.id);
      save(); renderShop(); $('next').focus();
    };
    row.append(label,button);
    $('items').append(row);
  }
}
$('launch').onclick = beginFlight;
$('skip').onclick = () => finishFlight(true);
$('next').onclick = startMission;
save();
startMission();
</script>
</html>
