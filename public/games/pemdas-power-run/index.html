  crawler:{range:125,warning:34,attack:19,speed:4.15,tone:165},
  drone:{range:180,warning:46,attack:32,speed:2.65,tone:205},

function updateRobot(enemy){
  const attack=robotAttacks[enemy.type];
  const dx=player.x+player.w/2-enemy.x-24;
  const near=Math.abs(dx)<attack.range&&Math.abs(player.y-enemy.y)<180;
  if(enemy.cooldown>0)enemy.cooldown--;
  if(!enemy.motion&&near&&!enemy.cooldown){
    enemy.motion='warning';
    enemy.timer=attack.warning;
    enemy.look=Math.sign(dx)||enemy.dir;
    if(Math.abs(enemy.x-cam-W/2)<W/2)beep(attack.tone,.22,'triangle');
  }

  let speed=(1.2+stage*.10)*(enemy.type==='heavy'?.65:1);
  if(enemy.motion==='warning'){
    speed=0;
    if(--enemy.timer===0){
      enemy.motion='attack';
      enemy.timer=attack.attack;
      enemy.dir=enemy.look;
    }
  }else if(enemy.motion==='attack'){
    speed=attack.speed;
    if(--enemy.timer===0){
      enemy.motion=null;
      enemy.cooldown=145;
    }
  }

  enemy.x+=enemy.dir*speed;
  if(enemy.x<=enemy.left||enemy.x>=enemy.right){
    enemy.x=Math.max(enemy.left,Math.min(enemy.right,enemy.x));
    if(enemy.motion!=='attack')enemy.dir=enemy.x===enemy.left?1:-1;
  }
  if(enemy.type==='drone'){
    const dive=enemy.motion==='attack'?Math.sin(Math.PI*enemy.timer/attack.attack)*80:0;
    enemy.y=enemy.base-115+Math.sin(frame*.04+enemy.x*.008)*35+dive;
  }
}

    circle(x+24,y+20,7,'#162832');

  }

  const warning=e.motion==='warning';
  const phase=warning?0:frame*(e.motion==='attack'?.31:.18);
  const pulse=warning?.36+.42*(1-e.timer/robotAttacks[type].warning):0;

function ready(k){return art[k]&&art[k].complete&&art[k].naturalWidth>0}
const districtThemes={
  steel:{asset:'steelworks.webp',sky:'#3c2228',ground:'#512b20',trim:'#ffc383',fixture:'#f3904f'},
  hangar:{asset:'drone-hangar.webp',sky:'#112b33',ground:'#29636b',trim:'#66e7e1',fixture:'#e5af55'},
  bridge:{asset:'skybridge.webp',sky:'#241635',ground:'#4d2e5b',trim:'#dd9afa',fixture:'#797cf1'},
  storm:{asset:'storm-harbor.webp',sky:'#172849',ground:'#263951',trim:'#a1baff',fixture:'#6498f3'},
  cryo:{asset:'cryo-facility.webp',sky:'#173349',ground:'#315363',trim:'#a9f7ff',fixture:'#6eddea'},
  reactor:{asset:'final-reactor.webp',sky:'#341926',ground:'#512731',trim:'#ff9b9c',fixture:'#ff666f'},
};
const stageThemes=[null,null,'steel','hangar','bridge','steel','storm','reactor','storm',
  'bridge','cryo','cryo','cryo','steel','storm','reactor','reactor'];
for(const theme of Object.values(districtThemes))artImage(theme.asset,theme.asset);
const themeForStage=()=>districtThemes[stageThemes[stage]];

function districtBackdrop(theme){
  const gradient=g.createLinearGradient(0,0,0,H);
  gradient.addColorStop(0,theme.sky);
  gradient.addColorStop(1,theme.ground);
  rect(0,0,W,H,gradient);
  const offset=Math.min(W*.28,cam*.085);
  if(ready(theme.asset)){
    const image=art[theme.asset];
    const width=quality==='high'?W*1.28:W;
    const height=width*image.naturalHeight/image.naturalWidth;
    const scale=Math.max(1,H/height);
    g.drawImage(image, (W-width*scale)/2+(quality==='high'?W*.14-offset:0),
      (H-height*scale)/2,width*scale,height*scale);
    const shade=g.createLinearGradient(0,0,0,H);
    shade.addColorStop(0,'#080d1d5a');
    shade.addColorStop(.58,'#080d1d06');
    shade.addColorStop(1,'#080d1dea');
    rect(0,0,W,H,shade);
  }
  if(quality!=='high')return;

  const district=stageThemes[stage];
  const rainy=district==='bridge'||district==='storm';
  const phase=frame*(rainy?5:district==='cryo'?.45:1.35);
  g.save();
  g.globalAlpha=rainy?.25:.48;
  for(let i=0;i<(rainy?72:42);i++){
    const x=(i*103+phase+W*5-(cam*.2)%W)%W;
    const y=rainy?(i*73+frame*13)%H:(i*137+H-(phase*(.9+(i%5)*.22))%H)%H;
    if(rainy)line(x,y,x-12,y+25,'#cadcff',1);
    else circle(x,y,1+i%3*.42,theme.trim);
  }
  g.restore();
  if(district==='storm'&&frame%430>=422){
    g.save();
    g.globalAlpha=.08*Math.sin((frame%430-422)/8*Math.PI);
    rect(0,0,W,H,'#d5e0ff');
    g.restore();
  }

  const movingOffset=(cam*.38)%460;
  for(let x=-movingOffset-460;x<W+120;x+=460){
    if(rainy){
      line(x,0,x+163,535,'#171b2fa8',5);
      line(x+169,246,x+169,560,'#252135ab',4);
      rect(x+165,527,8,4,theme.trim);
    }else{
      poly([[x,0],[x+66,0],[x+105,104],[x+105,660],[x+87,660],[x+87,112]],'#10182c87');
      rect(x+94,107,4,390,theme.fixture+'4d');
    }
  }
}

function drawDistrictPlatform(p,theme){
  const trim=theme?.trim||'#8cddf5';
  const fixture=theme?.fixture||'#f9b45d';
  const x=p.x,y=p.y,w=p.w;
  rect(x,y,w,3,trim);
  rect(x,y+4,w,2,'#040c15');
  if(quality!=='high')return;
  for(let left=x+12;left<x+w-12;left+=83){
    const right=Math.min(left+69,x+w-7);
    if(right-left<12)break;
    line(left,y+17,right,y+17,'#627587',1);
    if(p.h>30){
      poly([[left,y+24],[right,y+24],[right-8,y+52],[left+8,y+52]],'#111825');
      line(left+8,y+52,right-6,y+26,'#475467',3);
      rect(left+7,y+27,Math.min(28,right-left-10),3,fixture);
      rect(left+2,y+16,3,2,'#c3cbd2');
    }else{
      rect(left+3,y+10,Math.min(19,right-left-5),3,fixture);
    }
  }
}

function drawExit(){
  const x=goal.x,y=goal.y;
  const open=solved>=requiredBlocks();
  const light=open?'#6bffe0':'#ff7970';
  glow(x+34,y-68,110,open?'#45f0c44c':'#ff49482d');
  poly([[x-10,y],[x-10,y-101],[x+4,y-121],[x+65,y-121],[x+78,y-101],[x+78,y]],'#101b27');
  poly([[x,y],[x,y-98],[x+11,y-112],[x+58,y-112],[x+68,y-98],[x+68,y]],'#41546b');
  rect(x+8,y-88,52,88,open?'#123a42':'#241d2a');
  if(open){
    const portal=g.createLinearGradient(x+8,y,x+60,y-88);
    portal.addColorStop(0,'#7dffe1b0');
    portal.addColorStop(.52,'#37acbf44');
    portal.addColorStop(1,'#7dffe1cc');
    rect(x+8,y-88,52,88,portal);
    if(quality==='high'){
      for(let i=0;i<5;i++){
        const lineY=y-7-(i*19+frame*.64)%81;
        rect(x+9,lineY,50,2,'#c0fff689');
      }
    }
  }else{
    for(let i=0;i<5;i++)line(x+9,y-82+i*17,x+59,y-82+i*17,'#6b4350',2);
    line(x+34,y-88,x+34,y,'#513944',2);
  }
  rect(x+3,y-84,3,72,light);
  rect(x+62,y-84,3,72,light);
  rect(x+8,y-106,52,16,'#0c1620');
  g.textAlign='center';
  g.font='bold 10px system-ui';
  g.fillStyle=light;
  g.fillText(open?'EXIT OPEN':'EXIT LOCKED',x+34,y-94);
  g.textAlign='left';
}

function drawRocket(s){
  const direction=Math.sign(s.v);
  const tail=s.x-direction*14;
  glow(s.x,s.y,48,'#ff813967');
  line(s.x-s.v*3,s.y,s.x,s.y,'#ff5c2e77',8);
  poly([[tail,s.y-3],[tail-direction*(12+frame%7),s.y],[tail,s.y+3]],'#ffd478');
  poly([[s.x+direction*12,s.y],[s.x+direction*3,s.y-4],[tail,s.y-4],
    [tail,s.y+4],[s.x+direction*3,s.y+4]],'#dbe9f4');
  rect(s.x-2,s.y-3,4,6,'#dc5661');
  if(quality==='high'){
    for(let i=0;i<4;i++)circle(tail-direction*(15+i*7),s.y+Math.sin(frame+i)*i,3-i*.5,'#ff9b4fb7');
  }
}

function drawImpact(p){
  g.save();
  g.globalAlpha=Math.max(0,p.l/25);
  if(quality==='high')glow(p.x,p.y,14,'#ff8b4777');
  line(p.x-p.vx*1.8,p.y-p.vy*1.8,p.x,p.y,'#ff904c',2);
  circle(p.x,p.y,1.6,'#fff6c0');
  g.restore();
}

function foregroundLighting(){
  if(quality!=='high')return;
  const shade=g.createRadialGradient(W/2,H*.49,W*.26,W/2,H*.49,W*.62);
  shade.addColorStop(0,'#080c1400');
  shade.addColorStop(1,'#080c1480');
  rect(0,0,W,H,shade);
}

function backdrop(){const theme=themeForStage();if(theme){districtBackdrop(theme);return}proceduralBackdrop();if(stage!==1||!ready('factory'))return;g.save();g.globalAlpha=.84;let offset=(cam*.19)%W;g.drawImage(art.factory,-offset,0,W,H);g.drawImage(art.factory,W-offset,0,W,H);g.globalAlpha=1;let shade=g.createLinearGradient(0,0,0,H);shade.addColorStop(0,'#09182455');shade.addColorStop(.65,'#14252b00');shade.addColorStop(1,'#07121ba0');rect(0,0,W,H,shade);if(quality==='high'){for(let i=0;i<12;i++){let x=(i*179+frame*.55)%W,y=180+(i*71)%450;glow(x,y,32,'#a7d8df18');}glow(235,325,180,'#14b6c72b');}g.restore()}
function drawPlatform(p){if(p.x+p.w<cam||p.x>cam+W)return;proceduralPlatform(p);
  const theme=themeForStage();
  drawDistrictPlatform(p,theme);
  if(theme)return;
  if(stage!==1||!ready('metal'))return;g.save();g.beginPath();g.rect(p.x,p.y,p.w,Math.min(p.h,35));g.clip();for(let x=p.x;x<p.x+p.w;x+=146)g.drawImage(art.metal,x,p.y,146,35);g.restore();rect(p.x,p.y,p.w,2,'#b9d2d5');}
function drawPlayer(){let p=player;if(!p)return;let k=!p.ground?'jump':Math.abs(p.vx)>.1?'run':'idle';if(frame<(p.fireUntil||0))k='fire';if(!ready(k)){proceduralPlayer();return}if(p.inv&&Math.floor(frame/5)%2)return;let im=art[k],h=72,w=h*im.naturalWidth/im.naturalHeight;g.save();g.translate(p.x+p.w/2,p.y+p.h);g.scale(p.face,1);let bob=k==='run'?Math.sin(frame*.29)*2:0;g.rotate(k==='run'?Math.sin(frame*.29)*.035:0);g.drawImage(im,-w*.5,-h+bob,w,h);g.restore()}

function drawTutorial(){
  if(stage!==1||state!=='play'||!player||player.x>500)return;
  const block=blocks[0];
  const target=enemies[0];
  let text;
  if(!block.used)text='Move right and jump into the glowing block';
  else if(target.hp>0&&rockets>0)text='Face the target and press F to fire';
  else if(target.hp<=0)text='Now solve more blocks to open the exit';
  else text='Solve another block to reload rockets';
  g.save();
  g.font='bold 19px system-ui';
  g.textAlign='center';
  rect(68,395,435,38,'#071322ee');
  g.fillStyle='#f3faff';
  g.fillText(text,285,421);
  g.restore();
}

function draw(){backdrop();g.save();g.translate(-cam,0);for(const p of platforms||[])drawPlatform(p);for(const b of blocks||[])drawBlock(b);drawTutorial();for(const q of coins||[]){if(q.got)continue;glow(q.x,q.y,24,'#ffce5355');circle(q.x,q.y,10,'#b37920');circle(q.x,q.y,7,'#ffdb75');rect(q.x-1,q.y-5,2,10,'#c18b2a')}for(const e of enemies||[])drawRobot(e);if(goal)drawExit();
for(const shot of shots||[])drawRocket(shot);
for(const particle of particles||[])drawImpact(particle);
if(player)drawPlayer();
g.restore();
foregroundLighting();
if(feedbackTime>0&&state==='play'){rect(W/2-250,105,500,38,'#10202dde');g.textAlign='center';g.font='bold 18px system-ui';g.fillStyle='#b9f6ff';g.fillText(feedback,W/2,130);g.textAlign='left'}}
function pause(){if(state==='play'){state='pause';keys={};menu('Paused',`<p>Stage ${stage}: ${names[stage-1]}</p><button class="gold" id="resume">Resume</button> <button id="home">Main menu</button><p><button id="q">Graphics: ${quality}</button> <button id="snd">Sound: ${sound?'On':'Off'}</button></p>`);$('resume').onclick=()=>{state='play';$('overlay').classList.add('hidden')};$('home').onclick=home;$('q').onclick=()=>{quality=quality==='high'?'low':'high';$('q').textContent='Graphics: '+quality};$('snd').onclick=()=>{sound=!sound;$('snd').textContent='Sound: '+(sound?'On':'Off')}}else if(state==='pause'){$('overlay').classList.add('hidden');state='play'}}$('pause').onclick=pause;window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(k==='escape'){pause();return}if(state==='quiz'&&['1','2','3'].includes(k)){answer(question.opts[+k-1]);return}if(k==='f'&&!e.repeat)fire();keys[k]=true});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);window.addEventListener('blur',()=>{keys={};if(state==='play')pause()});document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[b.dataset.key]=true;if(b.dataset.key==='f')fire()};b.onpointerup=b.onpointercancel=()=>keys[b.dataset.key]=false});let last=0,acc=0;function loop(t){acc+=Math.min(100,t-last||16);last=t;while(acc>=1000/60){update();acc-=1000/60}draw();requestAnimationFrame(loop)}home();requestAnimationFrame(loop);
</script></html>
